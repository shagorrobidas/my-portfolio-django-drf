upstream django_app {
    server web:8000;
    keepalive 32;
}

# HTTP SERVER
server {
    listen 80;
    server_name shagorrobidas.dev www.shagorrobidas.dev;

    client_max_body_size 100M;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS SERVER
server {
    listen 443 ssl;
    server_name shagorrobidas.dev www.shagorrobidas.dev;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/shagorrobidas.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shagorrobidas.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}



