upstream django_app {
    server web:8000;
}

# HTTP SERVER (Port 80)
server {
    listen 80;
    server_name shagorrobidas.dev www.shagorrobidas.dev;

    client_max_body_size 100M;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS SERVER (Port 443)
server {
    listen 443 ssl;
    server_name shagorrobidas.dev www.shagorrobidas.dev;

    client_max_body_size 100M;

    # These files now exist because of Step 2!
    ssl_certificate /etc/letsencrypt/live/shagorrobidas.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shagorrobidas.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://django_app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}