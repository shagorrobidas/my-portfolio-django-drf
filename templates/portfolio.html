{% extends "base.html" %}

{% block title %}Portfolio | Dark Portfolio UI{% endblock %}

{% block content %}
<section>
    <div class="h1">Portfolio</div>
    <div class="underline"></div>

    <div class="filters" id="filters">
        <button class="chip active" data-filter="all">All</button>
    </div>

    <div class="projects" id="projects-grid"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
    async function initPortfolioPage() {
        const categories = await fetchAPI('categories');
        if (categories) {
            document.getElementById('filters').innerHTML = '<button class="chip active" data-filter="all">All</button>' +
                categories.map(c => `<button class="chip" data-filter="${c.name.toLowerCase()}">${c.name}</button>`).join('');
        }

        const projects = await fetchAPI('projects');
        if (projects) {
            document.getElementById('projects-grid').innerHTML = projects.map(p => {
                const cats = p.categories_list ? p.categories_list.map(c => c.toLowerCase()).join(' ') : 'all';
                const displayCats = p.categories_list ? p.categories_list.join(', ') : 'Uncategorized';
                let links = '';
                if (p.github_link) links += `<a href="${p.github_link}" target="_blank"><i class="fa-brands fa-github"></i></a>`;
                if (p.live_link) links += `<a href="${p.live_link}" target="_blank"><i class="fa-solid fa-eye"></i></a>`;

                return `
          <article class="proj" data-cat="${cats}">
            <div class="thumb">
              ${p.image ? `<img src="${p.image}">` : `<small>No Image</small>`}
              <div class="proj-links">${links}</div>
            </div>
            <div class="proj-body">
              <h3 class="proj-title">${p.title}</h3>
              <p class="proj-meta">${displayCats}</p>
              <div class="proj-tags">${p.tags_list.map(t => `<span class="tag">${t}</span>`).join('')}</div>
            </div>
          </article>
        `;
            }).join('');
        }

        document.getElementById('filters').addEventListener('click', (e) => {
            const chip = e.target.closest('.chip');
            if (!chip) return;
            const f = chip.dataset.filter;
            document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
            document.querySelectorAll('.proj').forEach(p => {
                p.style.display = (f === 'all' || p.dataset.cat.includes(f)) ? '' : 'none';
            });
        });
    }
    initPortfolioPage();
</script>
{% endblock %}
