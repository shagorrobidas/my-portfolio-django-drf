{% extends "base.html" %}

{% block title %}AI Job Recruiter{% endblock %}

{% block content %}
<section>
    <div class="h1">AI Job Recruiter</div>
    <div class="underline"></div>

    <div style="display: grid; grid-template-columns: 1fr; gap: 2rem; margin-top: 2rem;">
        
        <!-- Application Submission Form -->
        <div class="contact-card">
            <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem; color: #fff; font-weight: 600;">Target New Job</h2>
            <form class="form" id="jobForm" enctype="multipart/form-data">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; width: 100%;">
                    <div class="field">
                        <label>COMPANY NAME (AUTO-DETECTED BY AI)</label>
                        <input name="company_name" placeholder="Leave blank to auto-detect" />
                    </div>
                    <div class="field">
                        <label>JOB TITLE (AUTO-DETECTED BY AI)</label>
                        <input name="job_title" placeholder="Leave blank to auto-detect" />
                    </div>
                </div>
                
                <div class="field" style="margin-top: 1.5rem;">
                    <label>EMPLOYER EMAIL (OPTIONAL - AUTO-DETECTED BY AI)</label>
                    <input name="employer_email" type="email" placeholder="Leave blank to auto-detect or enter contact" />
                </div>
                
                <!-- Toggle Mode Selector -->
                <div style="display: flex; gap: 0.5rem; margin-top: 1.75rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem;">
                    <button type="button" id="toggle-text-btn" class="toggle-input-btn active-toggle" onclick="switchInputMode('text')">
                        <i class="fa-solid fa-align-left"></i> Paste Job Description
                    </button>
                    <button type="button" id="toggle-image-btn" class="toggle-input-btn" onclick="switchInputMode('image')">
                        <i class="fa-solid fa-image"></i> Upload Job Screenshot
                    </button>
                </div>
                
                <div id="input-mode-text" style="margin-top: 1.25rem;">
                    <div class="field">
                        <label>JOB DESCRIPTION TEXT</label>
                        <textarea name="job_description_text" placeholder="Paste the job requirements, details, and description here..."></textarea>
                    </div>
                </div>
                
                <div id="input-mode-image" style="margin-top: 1.25rem; display: none;">
                    <div class="field">
                        <label>UPLOAD JOB POST IMAGE</label>
                        <div class="file-upload-wrapper">
                            <input type="file" name="job_description_image" id="file-input" accept="image/*" />
                            <label for="file-input" class="file-upload-btn">
                                <i class="fa-solid fa-cloud-arrow-up"></i> Choose Screenshot / Image
                            </label>
                            <span id="file-name" class="file-name">No file chosen</span>
                        </div>
                    </div>
                </div>

                <div class="submit" style="margin-top: 2rem;">
                    <button class="btn" type="submit">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Generate CV & Cover Letter
                    </button>
                </div>
            </form>
        </div>

        <!-- History/List of Applications -->
        <div class="contact-card" style="margin-top: 1rem;">
            <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem; color: #fff; font-weight: 600;">My AI Applications</h2>
            <div id="applications-list" class="applications-grid">
                <div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Loading applications...</div>
            </div>
        </div>

    </div>
</section>

<!-- Custom Styling for Premium Elements -->
<style>
    .file-upload-wrapper {
        display: flex;
        align-items: center;
        gap: 1rem;
        background: rgba(255, 255, 255, 0.02);
        border: 1px dashed rgba(255, 255, 255, 0.1);
        padding: 0.85rem 1.25rem;
        border-radius: 8px;
        transition: all 0.2s ease;
    }
    .file-upload-wrapper:hover {
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.04);
    }
    #file-input {
        display: none;
    }
    .file-upload-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 0.5rem 1rem;
        border-radius: 6px;
        color: #fff;
        cursor: pointer;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
    }
    .file-upload-btn:hover {
        background: rgba(255, 255, 255, 0.12);
    }
    .file-name {
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.85rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 250px;
    }
    .applications-grid {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }
    .app-item {
        background: rgba(255, 255, 255, 0.015);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 12px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .app-item:hover {
        background: rgba(255, 255, 255, 0.035);
        transform: translateY(-2px);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
        border-color: rgba(255, 255, 255, 0.08);
    }
    .app-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 1rem;
    }
    .app-title-group h3 {
        font-size: 1.2rem;
        color: #fff;
        font-weight: 600;
        margin: 0;
    }
    .app-title-group p {
        color: rgba(255, 255, 255, 0.45);
        font-size: 0.9rem;
        margin: 0.35rem 0 0 0;
    }
    .badge-status {
        padding: 0.35rem 0.85rem;
        border-radius: 99px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
    }
    .status-draft, .status-generating {
        background: rgba(242, 193, 79, 0.1);
        color: #f2c14f;
        border: 1px solid rgba(242, 193, 79, 0.25);
    }
    .status-generated {
        background: rgba(46, 204, 113, 0.1);
        color: #2ecc71;
        border: 1px solid rgba(46, 204, 113, 0.25);
    }
    .status-emailed {
        background: rgba(155, 89, 182, 0.1);
        color: #9b59b6;
        border: 1px solid rgba(155, 89, 182, 0.25);
    }
    .app-downloads {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 0.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 1rem;
    }
    .download-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 0.45rem 0.9rem;
        border-radius: 6px;
        color: rgba(255, 255, 255, 0.85);
        font-size: 0.8rem;
        text-decoration: none;
        transition: all 0.2s ease;
    }
    .download-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
    }
    .download-btn.pdf:hover {
        border-color: rgba(231, 76, 60, 0.35);
        background: rgba(231, 76, 60, 0.08);
        color: #e74c3c;
    }
    .download-btn.word:hover {
        border-color: rgba(52, 152, 219, 0.35);
        background: rgba(52, 152, 219, 0.08);
        color: #3498db;
    }
    .loading-spinner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        color: rgba(255, 255, 255, 0.4);
        padding: 3rem;
        font-size: 1.1rem;
    }
    .tab-link {
        border-radius: 6px;
        font-family: inherit;
        border: none;
        outline: none;
    }
    .tab-link.active {
        background: rgba(255, 255, 255, 0.08) !important;
        color: #fff !important;
    }
    .expand-btn:hover {
        color: #fff !important;
    }
    .toggle-input-btn {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        padding: 0.5rem 1rem;
        position: relative;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border-radius: 6px;
    }
    .toggle-input-btn:hover {
        color: rgba(255, 255, 255, 0.85);
        background: rgba(255, 255, 255, 0.03);
    }
    .toggle-input-btn.active-toggle {
        color: #fff !important;
        background: rgba(255, 255, 255, 0.06);
    }
    .toggle-input-btn.active-toggle::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 15%;
        width: 70%;
        height: 2px;
        background: var(--accent);
    }
</style>
{% endblock %}

{% block scripts %}
<script>
    // Handle File Input UI
    const fileInput = document.getElementById('file-input');
    const fileNameSpan = document.getElementById('file-name');
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        fileNameSpan.textContent = file ? file.name : 'No file chosen';
    });

    const API_JOBS = '/api/v1/job-applications';
    const activePolls = new Set();

    // Fetch and Render Job Applications
    async function loadApplications() {
        try {
            const resp = await fetch(`${API_JOBS}/`);
            if (resp.ok) {
                const apps = await resp.json();
                renderApplications(apps);
            }
        } catch (err) {
            console.error('Failed to load applications:', err);
        }
    }

    function renderApplications(apps) {
        const container = document.getElementById('applications-list');
        if (apps.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: rgba(255,255,255,0.4); padding: 3rem;">No applications targeted yet. Submit one above to start!</div>`;
            return;
        }

        container.innerHTML = apps.map(app => {
            let badgeClass = 'status-draft';
            let statusText = app.status;
            let iconText = '<i class="fa-solid fa-clock"></i>';

            if (app.status === 'draft') {
                badgeClass = 'status-generating';
                statusText = 'AI Analyzing & Writing...';
                iconText = '<i class="fa-solid fa-spinner fa-spin"></i>';
                // Trigger polling if not already active for this ID
                triggerPolling(app.id);
            } else if (app.status === 'generated') {
                badgeClass = 'status-generated';
                statusText = 'Ready';
                iconText = '<i class="fa-solid fa-circle-check"></i>';
            } else if (app.status === 'emailed') {
                badgeClass = 'status-emailed';
                statusText = 'Emailed to Employer';
                iconText = '<i class="fa-solid fa-paper-plane"></i>';
            }

            const cvPdf = app.cv_pdf ? `<a href="${app.cv_pdf}" target="_blank" class="download-btn pdf"><i class="fa-regular fa-file-pdf"></i> Download CV (PDF)</a>` : '';
            const cvDocx = app.cv_word ? `<a href="${app.cv_word}" target="_blank" class="download-btn word"><i class="fa-regular fa-file-word"></i> Download CV (Word)</a>` : '';
            const clPdf = app.cover_letter_pdf ? `<a href="${app.cover_letter_pdf}" target="_blank" class="download-btn pdf"><i class="fa-regular fa-file-pdf"></i> Download Cover Letter (PDF)</a>` : '';
            const clDocx = app.cover_letter_word ? `<a href="${app.cover_letter_word}" target="_blank" class="download-btn word"><i class="fa-regular fa-file-word"></i> Download Cover Letter (Word)</a>` : '';

            const expandedPanel = app.status !== 'draft' ? `
                <div class="app-downloads">
                    ${cvPdf} ${cvDocx} ${clPdf} ${clDocx}
                </div>
                <div class="expand-toggle-wrapper" style="margin-top: 1rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem;">
                    <button class="expand-btn" onclick="toggleDetails(${app.id})" style="background: none; border: none; color: var(--accent); font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 0; transition: color 0.2s;">
                        <i class="fa-solid fa-chevron-down" id="chevron-${app.id}"></i> View AI Strategy & Application Assets
                    </button>
                    
                    <div id="details-${app.id}" class="details-panel" style="display: none; margin-top: 1rem; background: rgba(0,0,0,0.15); border-radius: 8px; border: 1px solid rgba(255,255,255,0.04); padding: 1.25rem;">
                        <!-- Tab Headers -->
                        <div class="tab-headers" style="display: flex; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; margin-bottom: 1rem;">
                            <button class="tab-link active" onclick="switchTab(event, 'strategy-${app.id}')" style="background: rgba(255, 255, 255, 0.08); border: none; color: #fff; padding: 6px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border-radius: 4px; transition: all 0.2s;">Strategy & Match</button>
                            <button class="tab-link" onclick="switchTab(event, 'outreach-${app.id}')" style="background: none; border: none; color: rgba(255,255,255,0.6); padding: 6px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border-radius: 4px; transition: all 0.2s;">Outreach Email</button>
                            <button class="tab-link" onclick="switchTab(event, 'cv-${app.id}')" style="background: none; border: none; color: rgba(255,255,255,0.6); padding: 6px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border-radius: 4px; transition: all 0.2s;">Generated CV & Cover Letter</button>
                        </div>
                        
                        <!-- Tab Content: Strategy -->
                        <div id="strategy-${app.id}" class="tab-content" style="display: block;">
                            <h4 style="color: #fff; font-size: 0.9rem; margin: 0 0 0.5rem 0;">AI Strategic Analysis & Interview Coach</h4>
                            <div style="background: rgba(0,0,0,0.25); padding: 1rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.03); max-height: 250px; overflow-y: auto; white-space: pre-wrap; font-size: 0.85rem; line-height: 1.5; color: rgba(255,255,255,0.85);">
                                ${app.ai_analysis_report ? app.ai_analysis_report : 'No analysis generated.'}
                            </div>
                        </div>
                        
                        <!-- Tab Content: Outreach -->
                        <div id="outreach-${app.id}" class="tab-content" style="display: none;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                                <h4 style="color: #fff; font-size: 0.9rem; margin: 0;">HR Outreach Email</h4>
                                <button onclick="copyToClipboard(event, ${app.id})" style="background: rgba(242, 193, 79, 0.1); border: 1px solid var(--accent); color: var(--accent); font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px;">
                                    <i class="fa-regular fa-copy"></i> Copy Full Email
                                </button>
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 8px;">
                                <div style="display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.03);">
                                    <span style="font-size: 0.8rem; font-weight: bold; color: var(--accent); min-width: 60px;">Subject:</span>
                                    <span id="subject-${app.id}" style="font-size: 0.85rem; color: #fff;">${app.apply_email_subject ? app.apply_email_subject : `Application for ${app.job_title}`}</span>
                                </div>
                                <div id="body-${app.id}" style="background: rgba(0,0,0,0.25); padding: 1rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.03); max-height: 200px; overflow-y: auto; white-space: pre-wrap; font-size: 0.85rem; line-height: 1.5; color: rgba(255,255,255,0.85);">${app.apply_email_body ? app.apply_email_body : app.generated_cover_letter}</div>
                            </div>
                        </div>
                        
                        <!-- Tab Content: CV / CL Text -->
                        <div id="cv-${app.id}" class="tab-content" style="display: none;">
                            <div style="display: flex; gap: 1rem; flex-direction: column;">
                                <div>
                                    <h5 style="color: #fff; font-size: 0.8rem; margin: 0 0 0.5rem 0;">Tailored CV Text</h5>
                                    <div style="background: rgba(0,0,0,0.25); padding: 1rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.03); max-height: 150px; overflow-y: auto; white-space: pre-wrap; font-size: 0.8rem; line-height: 1.4; color: rgba(255,255,255,0.7);">${app.generated_cv}</div>
                                </div>
                                <div>
                                    <h5 style="color: #fff; font-size: 0.8rem; margin: 0 0 0.5rem 0;">Tailored Cover Letter Text</h5>
                                    <div style="background: rgba(0,0,0,0.25); padding: 1rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.03); max-height: 150px; overflow-y: auto; white-space: pre-wrap; font-size: 0.8rem; line-height: 1.4; color: rgba(255,255,255,0.7);">${app.generated_cover_letter}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            ` : '';

            return `
                <div class="app-item" id="app-${app.id}">
                    <div class="app-header">
                        <div class="app-title-group">
                            <h3>${app.job_title}</h3>
                            <p><i class="fa-solid fa-building"></i> ${app.company_name} ${app.employer_email ? ` &bull; <i class="fa-regular fa-envelope"></i> ${app.employer_email}` : ''}</p>
                        </div>
                        <span class="badge-status ${badgeClass}">
                            ${iconText} ${statusText}
                        </span>
                    </div>
                    ${expandedPanel}
                </div>
            `;
        }).join('');
    }

    // Toggle details expansion
    function toggleDetails(appId) {
        const panel = document.getElementById(`details-${appId}`);
        const chevron = document.getElementById(`chevron-${appId}`);
        if (panel.style.display === 'none') {
            panel.style.display = 'block';
            chevron.classList.replace('fa-chevron-down', 'fa-chevron-up');
        } else {
            panel.style.display = 'none';
            chevron.classList.replace('fa-chevron-up', 'fa-chevron-down');
        }
    }

    // Switch tab inside details panel
    function switchTab(evt, tabId) {
        const panel = evt.currentTarget.closest('.details-panel');
        
        // Hide all sibling tab contents
        const contents = panel.querySelectorAll('.tab-content');
        contents.forEach(content => content.style.display = 'none');
        
        // Reset styles for all sibling links
        const tabLinks = panel.querySelectorAll('.tab-link');
        tabLinks.forEach(link => {
            link.classList.remove('active');
            link.style.color = 'rgba(255,255,255,0.6)';
            link.style.background = 'none';
        });
        
        // Activate current tab
        document.getElementById(tabId).style.display = 'block';
        evt.currentTarget.classList.add('active');
        evt.currentTarget.style.color = '#fff';
        evt.currentTarget.style.background = 'rgba(255,255,255,0.08)';
    }

    // Copy subject + body to clipboard
    function copyToClipboard(evt, appId) {
        const subjectText = document.getElementById(`subject-${appId}`).textContent;
        const bodyText = document.getElementById(`body-${appId}`).textContent;
        const textToCopy = `Subject: ${subjectText}\n\n${bodyText}`;
        
        navigator.clipboard.writeText(textToCopy).then(() => {
            const btn = evt.currentTarget;
            if (btn) {
                const origHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
                btn.style.borderColor = '#2ecc71';
                btn.style.color = '#2ecc71';
                setTimeout(() => {
                    btn.innerHTML = origHtml;
                    btn.style.borderColor = 'var(--accent)';
                    btn.style.color = 'var(--accent)';
                }, 2000);
            }
        }).catch(err => {
            console.error('Failed to copy text: ', err);
        });
    }

    // Polling function for active draft items
    function triggerPolling(appId) {
        if (activePolls.has(appId)) return;
        activePolls.add(appId);

        const interval = setInterval(async () => {
            try {
                const resp = await fetch(`${API_JOBS}/${appId}/`);
                if (resp.ok) {
                    const app = await resp.json();
                    if (app.status !== 'draft') {
                        clearInterval(interval);
                        activePolls.delete(appId);
                        loadApplications(); // Refresh the list once status changes
                    }
                }
            } catch (err) {
                console.error(`Error polling app ${appId}:`, err);
                clearInterval(interval);
                activePolls.delete(appId);
            }
        }, 3000);
    }

    // Submit Job Application Form
    let currentInputMode = 'text';

    function switchInputMode(mode) {
        currentInputMode = mode;
        const textBtn = document.getElementById('toggle-text-btn');
        const imageBtn = document.getElementById('toggle-image-btn');
        const textContainer = document.getElementById('input-mode-text');
        const imageContainer = document.getElementById('input-mode-image');
        
        const textArea = textContainer.querySelector('textarea');
        const fileInputEl = imageContainer.querySelector('input[type="file"]');
        
        if (mode === 'text') {
            textContainer.style.display = 'block';
            imageContainer.style.display = 'none';
            
            textBtn.classList.add('active-toggle');
            imageBtn.classList.remove('active-toggle');
            
            // Clear the other field to avoid posting both
            fileInputEl.value = '';
            document.getElementById('file-name').textContent = 'No file chosen';
        } else {
            textContainer.style.display = 'none';
            imageContainer.style.display = 'block';
            
            imageBtn.classList.add('active-toggle');
            textBtn.classList.remove('active-toggle');
            
            // Clear the other field to avoid posting both
            textArea.value = '';
        }
    }

    function showToast(message, type = 'error') {
        const toast = document.createElement('div');
        toast.style.position = 'fixed';
        toast.style.bottom = '2rem';
        toast.style.right = '2rem';
        toast.style.background = type === 'success' ? '#2ecc71' : '#e74c3c';
        toast.style.color = '#fff';
        toast.style.padding = '1rem 1.5rem';
        toast.style.borderRadius = '8px';
        toast.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
        toast.style.zIndex = '99999';
        toast.style.fontSize = '0.9rem';
        toast.style.fontWeight = '600';
        toast.style.display = 'flex';
        toast.style.alignItems = 'center';
        toast.style.gap = '0.5rem';
        toast.style.transition = 'all 0.3s ease';
        toast.style.transform = 'translateY(100px)';
        toast.style.opacity = '0';
        
        const icon = type === 'success' ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-triangle-exclamation"></i>';
        toast.innerHTML = `${icon} <span>${message}</span>`;
        
        document.body.appendChild(toast);
        
        // Trigger reflow/animation
        setTimeout(() => {
            toast.style.transform = 'translateY(0)';
            toast.style.opacity = '1';
        }, 50);
        
        // Remove toast
        setTimeout(() => {
            toast.style.transform = 'translateY(100px)';
            toast.style.opacity = '0';
            setTimeout(() => {
                toast.remove();
            }, 300);
        }, 4000);
    }

    document.getElementById('jobForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Validation check based on mode
        if (currentInputMode === 'text') {
            const textVal = e.target.querySelector('textarea[name="job_description_text"]').value.trim();
            if (!textVal) {
                showToast('Please paste the job description text.');
                return;
            }
        } else {
            const fileVal = document.getElementById('file-input').files[0];
            if (!fileVal) {
                showToast('Please upload a job post screenshot or image.');
                return;
            }
        }

        const btn = e.target.querySelector('button');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Triggering AI Recruiter...';
        btn.disabled = true;

        const formData = new FormData(e.target);
        
        try {
            const resp = await fetch(`${API_JOBS}/`, {
                method: 'POST',
                body: formData
            });

            if (resp.ok) {
                e.target.reset();
                fileNameSpan.textContent = 'No file chosen';
                switchInputMode('text');
                loadApplications(); // Reload applications list
                showToast('AI generation triggered successfully!', 'success');
            } else {
                showToast('Failed to trigger AI generator. Check your settings.');
            }
        } catch (err) {
            console.error('Error submitting form:', err);
            showToast('An error occurred. Check server connection.');
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });

    // Initial Load
    loadApplications();
</script>
{% endblock %}
