{% extends "base.html" %}

{% block title %}Blog | Dark Portfolio UI{% endblock %}

{% block content %}
<section>
    <div class="h1">Blog</div>
    <div class="underline"></div>
    <div class="posts" id="blog-posts"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
    async function initBlog() {
        const posts = await fetchAPI('posts');
        if (posts) {
            document.getElementById('blog-posts').innerHTML = posts.map(p => `
        <a href="${p.url || '#'}" class="post-link" target="_blank">
          <article class="post">
            <div class="img">
              ${p.image ? `<img src="${p.image}">` : `<span>${p.category}</span>`}
            </div>
            <div class="body">
              <div class="date">Post • ${formatBlogDate(p.date)}</div>
              <h3>${p.title}</h3>
              <p>${p.summary}</p>
            </div>
          </article>
        </a>
      `).join('');
        }
    }
    initBlog();
</script>
{% endblock %}
