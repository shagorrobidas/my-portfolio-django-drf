<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dark Portfolio UI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #15181d;
      --panel2: #12151a;
      --card: #171b20;
      --card2: #14181d;
      --stroke: rgba(255, 255, 255, .08);
      --text: #e7e9ee;
      --muted: rgba(231, 233, 238, .72);
      --muted2: rgba(231, 233, 238, .55);
      --accent: #f2c14f;
      /* yellow-gold */
      --accent2: #e7b33f;
      --shadow: 0 24px 60px rgba(0, 0, 0, .55);
      --radius: 20px;
      --radius2: 16px;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background:
        radial-gradient(1200px 500px at 20% -10%, rgba(242, 193, 79, .10), transparent 55%),
        radial-gradient(900px 500px at 85% 0%, rgba(255, 255, 255, .05), transparent 55%),
        radial-gradient(900px 700px at 60% 120%, rgba(242, 193, 79, .08), transparent 55%),
        var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button {
      font: inherit
    }

    /* Layout */
    .wrap {
      max-width: 1320px;
      margin: 28px auto;
      padding: 0 18px;
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 22px;
      align-items: start;
    }

    @media (max-width: 1020px) {
      .wrap {
        grid-template-columns: 1fr
      }
    }

    /* Sidebar */
    .sidebar {
      position: sticky;
      top: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .03));
      border: 1px solid var(--stroke);
      border-radius: 26px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .side-inner {
      padding: 18px 18px 14px
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 12px 10px;
    }

    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, .12);
      overflow: hidden;
      background: #353536;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .55);
      margin-bottom: 25px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .name {
      margin: 14px 0 8px;
      font-size: 22px;
      letter-spacing: .2px;
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .10);
      background: rgba(0, 0, 0, .22);
      color: rgba(255, 255, 255, .84);
      font-size: 12px;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, .08);
      margin: 16px 0;
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 6px 6px 10px;
    }

    .info-row {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 14px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(0, 0, 0, .18);
      border: 1px solid rgba(255, 255, 255, .06);
    }

    .iconbox {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .02);
      border: 1px solid rgba(255, 255, 255, .08);
      color: var(--accent);
      font-size: 18px;
    }

    .iconbox svg {
      width: 20px;
      height: 20px;
    }

    .k {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: rgba(255, 255, 255, .55);
      margin-bottom: 2px;
    }

    .v {
      font-size: 13px;
      color: rgba(255, 255, 255, .86);
      line-height: 1.25;
      word-break: break-word;
    }

    .social {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 10px 0 14px;
    }

    .soc {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .10);
      background: rgba(0, 0, 0, .22);
      color: rgba(255, 255, 255, .82);
      transition: .2s ease;
      font-size: 16px;
    }

    .soc:hover {
      transform: translateY(-2px);
      border-color: rgba(242, 193, 79, .35);
      color: var(--accent);
    }

    /* Main */
    .main {
      background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .03));
      border: 1px solid var(--stroke);
      border-radius: 26px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(10px);
      min-height: 760px;
      position: relative;
    }

    .topbar {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 100;
      border-bottom-left-radius: 20px;
      border: 1px solid var(--stroke);
      background: var(--panel);
      padding: 0 20px;
    }

    .nav {
      display: flex;
      gap: 10px;
    }

    .nav button {
      cursor: pointer;
      border: 0;
      padding: 15px 20px;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      transition: .3s ease;
    }

    .nav button:hover {
      color: var(--text);
    }

    .nav button.active {
      color: var(--accent);
    }

    .content {
      padding: 10px 18px 20px;
    }

    @media (max-width: 520px) {
      .content {
        padding: 10px 14px 18px;
      }
    }

    /* Section headings */
    .h1 {
      margin: 14px 0 8px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .underline {
      width: 38px;
      height: 4px;
      background: var(--accent);
      border-radius: 999px;
      margin: 10px 0 16px;
    }

    .p {
      color: var(--muted);
      margin: 0 0 18px;
      letter-spacing: .2px;
      line-height: 1.6;
      max-width: 86ch;
    }

    /* Cards */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 900px) {
      .grid-2 {
        grid-template-columns: 1fr
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 30px;
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 20px;
      align-items: start;
      box-shadow: var(--shadow);
    }

    .mini-ico {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(242, 193, 79, .10);
      border: 1px solid rgba(242, 193, 79, .22);
      color: var(--accent);
      flex-shrink: 0;
    }

    .mini-ico svg {
      width: 24px;
      height: 24px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .card-desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }

    .card-title .mini-ico {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(242, 193, 79, .10);
      border: 1px solid rgba(242, 193, 79, .24);
      color: var(--accent);
      flex: 0 0 auto;
    }

    .section-title {
      margin: 26px 0 14px;
      font-size: 22px;
      font-weight: 900;
    }

    /* Testimonials slider */
    .slider-wrap {
      margin-top: 25px;
      position: relative;
    }

    .slider {
      overflow-x: auto;
      scrollbar-width: none;
      margin: 0 -15px;
      padding: 15px;
      display: flex;
      scroll-behavior: smooth;
    }

    .slider::-webkit-scrollbar {
      display: none;
    }

    .track {
      display: flex;
      gap: 25px;
    }

    .tcard {
      min-width: calc(50% - 13px);
      padding-top: 30px;
    }

    @media (max-width: 900px) {
      .tcard {
        min-width: 100%;
      }
    }

    .tcard-inner {
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 30px;
      position: relative;
      height: 100%;
    }

    .tava {
      position: absolute;
      top: -30px;
      left: 30px;
      width: 60px;
      height: 60px;
      background: var(--panel2);
      border-radius: 18px;
      border: 1px solid var(--stroke);
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .3);
    }

    .tava img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tname {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin: 10px 0 15px;
    }

    .ttext {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Scroll Bars */
    .scroll-track {
      height: 4px;
      background: var(--stroke);
      border-radius: 10px;
      margin: 20px auto 0;
      max-width: 400px;
      position: relative;
      overflow: hidden;
    }

    .scroll-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: var(--accent);
      border-radius: 10px;
      width: 30%;
      transition: left .3s ease;
    }

    /* Clients */
    .clients-wrap {
      margin-top: 25px;
      position: relative;
    }

    .clients-slider {
      overflow-x: auto;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .clients-slider::-webkit-scrollbar {
      display: none;
    }

    .clients-track {
      display: flex;
      align-items: center;
      gap: 40px;
      padding: 10px 0;
      width: max-content;
    }

    .client-item {
      min-width: 150px;
      flex-shrink: 0;
      opacity: .6;
      transition: opacity .3s ease;
    }

    .client-item img {
      width: 100%;
      filter: grayscale(1) brightness(max(1, calc(100% * var(--accent))));
      /* subtle tweak */
    }

    /* Resume timeline */
    .timeline {
      position: relative;
      padding-left: 18px;
    }

    .timeline:before {
      content: "";
      position: absolute;
      left: 8px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: rgba(255, 255, 255, .08);
    }

    .titem {
      position: relative;
      padding: 12px 12px 12px 12px;
      margin: 0 0 10px;
      border-radius: 18px;
      background: rgba(0, 0, 0, .16);
      border: 1px solid rgba(255, 255, 255, .08);
    }

    .titem:before {
      content: "";
      position: absolute;
      left: -18px;
      top: 18px;
      width: 10px;
      height: 10px;
      border-radius: 99px;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(242, 193, 79, .16);
    }

    .trole {
      font-weight: 900;
      margin: 0 0 4px;
    }

    .tmeta {
      color: rgba(242, 193, 79, .92);
      font-weight: 800;
      font-size: 12px;
      margin: 0 0 6px;
    }

    .tinfo {
      color: var(--muted);
      line-height: 1.7;
      font-size: 13px;
      margin: 0;
    }

    /* Skills */
    .skills {
      margin-top: 10px;
    }

    .skill {
      margin: 14px 0;
    }

    .skill .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .skill .label {
      font-weight: 900;
    }

    .skill .pct {
      color: rgba(255, 255, 255, .70);
      font-weight: 800;
      font-size: 12px;
    }

    .bar {
      margin-top: 8px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .08);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(242, 193, 79, .85), rgba(242, 193, 79, .55));
      width: 0%;
      transition: width .6s ease;
    }

    /* Portfolio */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 8px 0 14px;
    }

    .chip {
      cursor: pointer;
      padding: 8px 18px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      font-weight: 400;
      transition: .2s ease;
    }

    .chip:hover {
      color: var(--muted);
    }

    .chip.active {
      color: var(--accent);
      background: rgba(242, 193, 79, .05);
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 1080px) {
      .projects {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .projects {
        grid-template-columns: 1fr;
      }
    }

    .proj {
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--stroke);
      background: var(--card);
      transition: .2s ease;
      display: flex;
      flex-direction: column;
    }

    .proj:hover {
      transform: translateY(-4px);
      border-color: rgba(242, 193, 79, .3);
    }

    .thumb {
      height: 180px;
      background: var(--panel2);
      position: relative;
      overflow: hidden;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s ease;
    }

    .proj:hover .thumb img {
      transform: scale(1.08);
    }

    .thumb:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, .6));
      pointer-events: none;
    }

    .thumb small {
      color: rgba(255, 255, 255, .55);
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .proj-body {
      padding: 18px;
    }

    .proj-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .proj-meta {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .proj-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .05);
      color: var(--muted);
      border: 1px solid var(--stroke);
    }

    /* Blog */
    .posts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 900px) {
      .posts {
        grid-template-columns: 1fr;
      }
    }

    .post {
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .08);
      background: rgba(0, 0, 0, .16);
      transition: .18s ease;
    }

    .post:hover {
      transform: translateY(-2px);
      border-color: rgba(242, 193, 79, .22);
    }

    .post .img {
      height: 190px;
      background:
        radial-gradient(700px 260px at 30% 20%, rgba(242, 193, 79, .16), transparent 58%),
        linear-gradient(135deg, rgba(120, 90, 255, .20), rgba(0, 0, 0, 0)),
        linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .02));
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .post .img::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(600px 240px at 70% 30%, rgba(0, 255, 209, .08), transparent 60%);
      pointer-events: none;
      opacity: .7;
    }

    .post .img span {
      position: relative;
      z-index: 2;
      font-weight: 950;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .62);
      font-size: 12px;
    }

    .post .body {
      padding: 14px;
    }

    .post .date {
      color: rgba(255, 255, 255, .55);
      font-weight: 800;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .post h3 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 950;
      color: var(--accent);
    }

    .post p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 13px;
    }

    .post a.more {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: rgba(255, 255, 255, .82);
      font-weight: 900;
      font-size: 13px;
    }

    .post a.more:hover {
      color: var(--accent);
    }

    /* Contact */
    .card.soft {
      display: block;
      padding: 40px;
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-top: 0;
    }

    @media (max-width: 800px) {
      .form {
        grid-template-columns: 1fr;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .field input,
    .field textarea {
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      padding: 15px;
      color: var(--text);
      font-size: 15px;
      transition: .3s ease;
      outline: none;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(242, 193, 79, .05);
    }

    .field textarea {
      height: 150px;
      resize: vertical;
      grid-column: 1 / -1;
    }

    .submit {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      padding: 15px 30px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: .3s ease;
      box-shadow: var(--shadow);
    }

    .btn:hover {
      background: var(--panel2);
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    /* Section switching */
    section[data-page] {
      display: none
    }

    section[data-page].active {
      display: block
    }

    /* Small helper */
    .muted {
      color: var(--muted);
    }

    .row-gap {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .pill {
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .10);
      background: rgba(0, 0, 0, .18);
      color: rgba(255, 255, 255, .78);
      font-weight: 900;
      font-size: 12px;
    }

    /* Inline SVG icons */
    svg {
      width: 18px;
      height: 18px
    }
  </style>
</head>

<body>

  <div class="wrap">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="side-inner">
        <div class="profile">
          <div class="avatar">
            <img id="profile-avatar" src="" alt="Profile" />
          </div>
          <div id="profile-name" class="name">Your Name</div>
          <div id="profile-badge" class="badge">
            <span
              style="width:7px;height:7px;border-radius:99px;background:rgba(242,193,79,.9);display:inline-block"></span>
            <span id="profile-title"></span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="info">
          <div class="info-row">
            <div class="iconbox" title="Email">
              <!-- mail -->
              <!-- <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16v16H4z" />
                <path d="m4 6 8 7 8-7" />
              </svg> -->
              <i class="fa-regular fa-envelope"></i>
            </div>
            <div>
              <div class="k">Email</div>
              <div id="profile-email" class="v"></div>
            </div>
          </div>

          <div class="info-row">
            <div class="iconbox" title="LinkedIn">
              <i class="fa-brands fa-linkedin-in"></i>
            </div>
            <div>
              <div class="k">LinkedIn</div>
              <div id="profile-linkedin" class="v"></div>
            </div>
          </div>

          <div class="info-row">
            <div class="iconbox" title="GitHub">
              <i class="fa-brands fa-github"></i>
            </div>
            <div>
              <div class="k">GitHub</div>
              <div id="profile-github" class="v"></div>
            </div>
          </div>

          <div class="info-row">
            <div class="iconbox" title="Birthday">
              <i class="fa-regular fa-calendar"></i>
            </div>
            <div>
              <div class="k">Birthday</div>
              <div id="profile-birthday" class="v"></div>
            </div>
          </div>

          <div class="info-row">
            <div class="iconbox" title="Location">
              <i class="fa-solid fa-location-dot"></i>
            </div>
            <div>
              <div class="k">Location</div>
              <div id="profile-location" class="v"></div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="social">
          <a class="soc" href="#" title="Website">
            <i class="fa-solid fa-globe"></i>
          </a>
          <a class="soc" href="#" title="LinkedIn">
            <i class="fa-brands fa-linkedin-in"></i>
          </a>
          <a class="soc" href="#" title="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
          <a class="soc" href="#" title="Contact">
            <i class="fa-solid fa-phone"></i>
          </a>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="topbar">
        <div class="nav" id="nav">
          <button class="active" data-go="about">About</button>
          <button data-go="resume">Resume</button>
          <button data-go="portfolio">Portfolio</button>
          <button data-go="blog">Blog</button>
          <button data-go="contact">Contact</button>
        </div>
      </div>

      <div class="content">
        <!-- ABOUT -->
        <section data-page="about" class="active">
          <div class="h1">About Me</div>
          <div class="underline"></div>
          <div id="about-content">
            <p class="p">

            </p>
            <p class="p">

            </p>
          </div>

          <div class="section-title">What I'm Doing</div>
          <div class="grid-2" id="services-grid">
            <!-- Services will be loaded here -->
          </div>

          <div class="section-title">Testimonials</div>
          <div class="slider-wrap">
            <div class="slider">
              <div class="track" id="track">
                <!-- Testimonials will be loaded here -->
              </div>
            </div>
            <div class="scroll-track">
              <div class="scroll-bar" id="testimonial-scroll"></div>
            </div>
          </div>

          <div class="section-title">Clients</div>
          <div class="clients-wrap">
            <div class="clients-slider">
              <div class="clients-track" id="clients-track">
                <!-- Clients will be loaded here -->
              </div>
            </div>
            <div class="scroll-track">
              <div class="scroll-bar" id="clients-scroll"></div>
            </div>
          </div>
        </section>

        <!-- RESUME -->
        <section data-page="resume">
          <div class="h1">Resume</div>
          <div class="underline"></div>

          <div class="section-title">Education</div>
          <div class="timeline" id="education-timeline">
            <!-- Education items will be loaded here -->
          </div>

          <div class="section-title">Experience</div>
          <div class="timeline" id="experience-timeline">
            <!-- Experience items will be loaded here -->
          </div>

          <div class="section-title">My Skills</div>
          <div class="card soft skills" id="skills-container">
            <!-- Skills will be loaded here -->
          </div>
        </section>

        <!-- PORTFOLIO -->
        <section data-page="portfolio">
          <div class="h1">Portfolio</div>
          <div class="underline"></div>

          <div class="filters" id="filters">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="backend">Backend Development</button>
            <button class="chip" data-filter="api">API Development & Integration</button>
            <button class="chip" data-filter="db">Database Management</button>
            <button class="chip" data-filter="web">Web Development</button>
          </div>

          <div class="projects" id="projects-grid">
            <!-- Projects will be loaded here -->
          </div>
        </section>

        <!-- BLOG -->
        <section data-page="blog">
          <div class="h1">Blog</div>
          <div class="underline"></div>

          <div class="posts" id="blog-posts">
            <!-- Blog posts will be loaded here -->
          </div>
        </section>

        <!-- CONTACT -->
        <section data-page="contact">
          <div class="h1">Contact</div>
          <div class="underline"></div>


          <div class="card soft">
            <form class="form" id="contactForm">
              <div class="field">
                <label>FULL NAME</label>
                <input id="contact-name" name="full_name" required placeholder="Your name" />
              </div>
              <div class="field">
                <label>EMAIL</label>
                <input id="contact-email" name="email" type="email" required placeholder="you@email.com" />
              </div>
              <div class="field" style="grid-column: 1 / -1;">
                <label>SUBJECT</label>
                <input id="contact-subject" name="subject" required placeholder="Subject" />
              </div>
              <div class="field" style="grid-column: 1 / -1;">
                <label>MESSAGE</label>
                <textarea id="contact-message" name="message" required placeholder="Write your message..."></textarea>
              </div>

              <div class="submit">
                <button class="btn" type="submit">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13" />
                    <path d="M22 2l-7 20-4-9-9-4z" />
                  </svg>
                  Send Message
                </button>
              </div>
            </form>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script>
    // ===== API INTEGRATION =====
    const API_BASE = 'http://127.0.0.1:8000/api/v1';

    async function fetchAPI(endpoint) {
      try {
        const response = await fetch(`${API_BASE}/${endpoint}/`);
        return await response.json();
      } catch (err) {
        console.error(`Failed to fetch ${endpoint}:`, err);
        return null;
      }
    }

    async function initPortfolio() {
      // Profile
      const profile = await fetchAPI('profile');
      if (profile) {
        document.getElementById('profile-name').textContent = profile.name;
        document.getElementById('profile-title').textContent = profile.title;
        document.getElementById('profile-email').textContent = profile.email;
        document.getElementById('profile-linkedin').textContent = profile.linkedin;
        document.getElementById('profile-github').textContent = profile.github;
        document.getElementById('profile-location').textContent = profile.location;
        document.getElementById('profile-birthday').textContent = profile.birthday;
        if (profile.avatar) document.getElementById('profile-avatar').src = profile.avatar;

        const aboutHTML = `
          <p class="p">${profile.about_text}</p>
          <p class="p">${profile.about_text_extra}</p>
        `;
        document.getElementById('about-content').innerHTML = aboutHTML;
        console.log(profile);
      }

      // Services
      const services = await fetchAPI('services');
      if (services) {
        const grid = document.getElementById('services-grid');
        grid.innerHTML = services.map(s => {
          let icon = s.icon_svg;
          if (!icon.includes('<svg')) {
            icon = `<svg viewBox="0 0 24 24" fill="currentColor">${icon}</svg>`;
          }
          return `
            <div class="card">
              <div class="mini-ico">${icon}</div>
              <div class="card-content">
                <div class="card-title">${s.title}</div>
                <p class="card-desc">${s.description}</p>
              </div>
            </div>
          `;
        }).join('');
      }

      // Testimonials
      const testimonials = await fetchAPI('testimonials');
      if (testimonials) {
        const track = document.getElementById('track');
        track.innerHTML = testimonials.map(t => `
          <div class="tcard">
            <div class="tcard-inner">
              <div class="tava">
                ${t.client_initials ? `<span>${t.client_initials}</span>` : `<img src="${t.client_image}" alt="${t.client_name}">`}
              </div>
              <div class="tname">${t.client_name}</div>
              <p class="ttext">${t.text}</p>
            </div>
          </div>
        `).join('');
        initSlider();
      }

      // Clients
      const clients = await fetchAPI('clients');
      if (clients) {
        const track = document.getElementById('clients-track');
        track.innerHTML = clients.map(c => `
          <div class="client-item">
            <img src="${c.logo}" alt="${c.name}">
          </div>
        `).join('');
        initClients();
      }

      // Categories (New dynamic integration)
      const categories = await fetchAPI('categories');
      if (categories) {
        const filters = document.getElementById('filters');
        filters.innerHTML = '<button class="chip active" data-filter="all">All</button>' +
          categories.map(c => `
            <button class="chip" data-filter="${c.name.toLowerCase()}">${c.name}</button>
          `).join('');
      }

      // Skills
      const skills = await fetchAPI('skills');
      if (skills) {
        const container = document.getElementById('skills-container');
        container.innerHTML = skills.map(s => `
          <div class="skill" data-skill="${s.proficiency}">
            <div class="row"><div class="label">${s.name}</div><div class="pct">${s.proficiency}%</div></div>
            <div class="bar"><div class="fill"></div></div>
          </div>
        `).join('');
      }

      // Resume (Education & Experience)
      const education = await fetchAPI('education');
      if (education) {
        document.getElementById('education-timeline').innerHTML = education.map(e => `
          <div class="titem">
            <p class="trole">${e.degree}</p>
            <p class="tmeta">${e.date_range}</p>
            <p class="tinfo">${e.description}</p>
          </div>
        `).join('');
      }

      const experience = await fetchAPI('experience');
      if (experience) {
        document.getElementById('experience-timeline').innerHTML = experience.map(e => `
          <div class="titem">
            <p class="trole">${e.role}</p>
            <p class="tmeta">${e.date_range}</p>
            <p class="tinfo">${e.description}</p>
          </div>
        `).join('');
      }

      // Projects
      const projectsData = await fetchAPI('projects');
      if (projectsData) {
        const grid = document.getElementById('projects-grid');
        grid.innerHTML = projectsData.map(p => `
          <article class="proj" data-cat="${p.category_name.toLowerCase()}">
            <div class="thumb">
              ${p.image ? `<img src="${p.image}" style="width:100%; height:100%; object-fit:cover;">` : `<small>Project Preview</small>`}
            </div>
            <div class="proj-body">
              <h3 class="proj-title">${p.title}</h3>
              <p class="proj-meta">Category: ${p.category_name}</p>
              <div class="proj-tags">
                ${p.tags_list.map(t => `<span class="tag">${t}</span>`).join('')}
              </div>
            </div>
          </article>
        `).join('');
      }

      // Blog
      const posts = await fetchAPI('posts');
      if (posts) {
        const grid = document.getElementById('blog-posts');
        grid.innerHTML = posts.map(p => `
          <article class="post">
            <div class="img">
              ${p.image ? `<img src="${p.image}" style="width:100%; height:100%; object-fit:cover;">` : `<span>${p.category}</span>`}
            </div>
            <div class="body">
              <div class="date">Post • ${p.date}</div>
              <h3>${p.title}</h3>
              <p>${p.summary}</p>
              <a class="more" href="#">
                Read more
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M7 17L17 7"/><path d="M9 7h8v8"/>
                </svg>
              </a>
            </div>
          </article>
        `).join('');
      }
    }

    // ===== NAV: switch pages =====
    const nav = document.getElementById('nav');
    const pages = [...document.querySelectorAll('section[data-page]')];

    function showPage(key) {
      pages.forEach(s => s.classList.toggle('active', s.dataset.page === key));
      [...nav.querySelectorAll('button')].forEach(b => b.classList.toggle('active', b.dataset.go === key));
      // animate skill bars when resume opens
      if (key === 'resume') fillSkills();
    }

    nav.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-go]');
      if (!btn) return;
      showPage(btn.dataset.go);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ===== TESTIMONIALS SLIDER =====
    function initSlider() {
      const slider = document.querySelector('.slider');
      const track = document.getElementById('track');
      const bar = document.getElementById('testimonial-scroll');
      if (!slider || !track || !bar) return;

      const updateProgress = () => {
        const total = track.scrollWidth - slider.clientWidth;
        if (total <= 0) {
          bar.parentElement.style.display = 'none';
          return;
        }
        bar.parentElement.style.display = 'block';
        const pct = (slider.scrollLeft / total) * 100;
        bar.style.width = '30%';
        bar.style.left = `${pct * 0.7}%`;
      };

      slider.addEventListener('scroll', updateProgress);
      window.addEventListener('resize', updateProgress);
      setTimeout(updateProgress, 100);

      // Auto scroll loop
      let scrollIdx = 0;
      setInterval(() => {
        const cards = track.querySelectorAll('.tcard');
        if (cards.length === 0) return;
        const cardWidth = cards[0].clientWidth + 25;
        scrollIdx = (scrollIdx + 1) % cards.length;
        if (scrollIdx === 0) slider.scrollTo({ left: 0, behavior: 'smooth' });
        else slider.scrollBy({ left: cardWidth, behavior: 'smooth' });
      }, 5000);
    }

    // ===== CLIENTS SLIDER =====
    function initClients() {
      const slider = document.querySelector('.clients-slider');
      const track = document.getElementById('clients-track');
      const bar = document.getElementById('clients-scroll');
      if (!slider || !track || !bar) return;

      const updateBar = () => {
        const total = track.scrollWidth - slider.clientWidth;
        if (total <= 0) {
          bar.parentElement.style.display = 'none';
          return;
        }
        bar.parentElement.style.display = 'block';
        const pct = (slider.scrollLeft / total) * 100;
        bar.style.width = '30%';
        bar.style.left = `${pct * 0.7}%`;
      };

      slider.addEventListener('scroll', updateBar);
      window.addEventListener('resize', updateBar);
      setTimeout(updateBar, 100);

      // Slow auto-scroll for clients
      setInterval(() => {
        if (slider.scrollLeft + slider.clientWidth >= track.scrollWidth - 10) {
          slider.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
          slider.scrollBy({ left: 200, behavior: 'smooth' });
        }
      }, 4000);
    }

    // ===== PORTFOLIO FILTERS =====
    document.getElementById('filters').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      const f = chip.dataset.filter;
      const projectsList = [...document.querySelectorAll('#projects-grid .proj')];

      [...document.getElementById('filters').querySelectorAll('.chip')].forEach(c => c.classList.toggle('active', c === chip));

      projectsList.forEach(p => {
        const cat = p.dataset.cat;
        const ok = f === 'all' ? true : cat.includes(f);
        p.style.display = ok ? '' : 'none';
      });
    });

    // ===== SKILLS FILL ANIMATION =====
    function fillSkills() {
      document.querySelectorAll('.skill').forEach(s => {
        const pct = Number(s.dataset.skill || 0);
        const fill = s.querySelector('.fill');
        requestAnimationFrame(() => fill.style.width = pct + '%');
      });
    }

    // ===== CONTACT FORM API =====
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      try {
        const response = await fetch(`${API_BASE}/contact/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (response.ok) {
          alert('Message sent successfully!');
          e.target.reset();
        } else {
          alert('Failed to send message.');
        }
      } catch (err) {
        console.error('Contact error:', err);
        alert('An error occurred.');
      }
    });

    // Initialize everything
    initPortfolio();

    // If user lands on resume via hash: #resume
    const hash = (location.hash || '').replace('#', '').trim();
    if (hash) showPage(hash);
  </script>
</body>

</html>
