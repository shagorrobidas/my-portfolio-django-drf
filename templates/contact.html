{% extends "base.html" %}

{% block title %}Contact{% endblock %}

{% block content %}
<section>
    <div class="h1">Contact</div>
    <div class="underline"></div>

    <div class="contact-card">
        <form class="form" id="contactForm">
            <div class="field">
                <label>FULL NAME</label>
                <input name="full_name" required placeholder="Your name" />
            </div>
            <div class="field">
                <label>EMAIL</label>
                <input name="email" type="email" required placeholder="you@email.com" />
            </div>
            <div class="field" style="grid-column: 1 / -1;">
                <label>SUBJECT</label>
                <input name="subject" required placeholder="Subject" />
            </div>
            <div class="field" style="grid-column: 1 / -1;">
                <label>MESSAGE</label>
                <textarea name="message" required placeholder="Write your message..."></textarea>
            </div>

            <div class="submit">
                <button class="btn" type="submit">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13" />
                        <path d="M22 2l-7 20-4-9-9-4z" />
                    </svg>
                    Send Message
                </button>
            </div>
        </form>
    </div>
</section>

<!-- Modal -->
<div class="modal-overlay" id="successModal">
    <div class="modal-content">
        <div class="modal-icon">
            <i class="fa-solid fa-check"></i>
        </div>
        <div class="modal-title">Message Sent!</div>
        <p class="modal-text">Thanks for reaching out. I'll get back to you shortly.</p>
        <button class="modal-btn" onclick="closeModal()">Awesome</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const modal = document.getElementById('successModal');
    const modalIcon = modal.querySelector('.modal-icon');
    const modalTitle = modal.querySelector('.modal-title');
    const modalText = modal.querySelector('.modal-text');
    const modalBtn = modal.querySelector('.modal-btn');

    function showModal(type, title, message) {
        // Reset classes
        modalIcon.className = 'modal-icon';
        modalBtn.className = 'modal-btn';
        modalIcon.innerHTML = '';

        if (type === 'success') {
            modalIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
            modalBtn.innerText = 'Awesome';
        } else {
            modalIcon.classList.add('error');
            modalBtn.classList.add('error');
            modalIcon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            modalBtn.innerText = 'Try Again';
        }

        modalTitle.innerText = title;
        modalText.innerText = message;

        modal.style.display = 'flex';
        void modal.offsetWidth;
        modal.classList.add('active');
    }

    function closeModal() {
        modal.classList.remove('active');
        setTimeout(() => {
            modal.style.display = 'none';
        }, 300);
    }

    // Close on outside click
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
        btn.disabled = true;

        const data = Object.fromEntries(new FormData(e.target).entries());
        try {
            const resp = await fetch(`${API_BASE}/contact/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (resp.ok) {
                showModal('success', 'Message Sent!', "Thanks for reaching out. I'll get back to you shortly.");
                e.target.reset();
            } else {
                showModal('error', 'Failed to Send', 'Failed to send message. Please try again.');
            }
        } catch (err) {
            showModal('error', 'Error', 'An error occurred. Please check your connection.');
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });
</script>
{% endblock %}
